<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Students | EduTrack</title>

    <meta name="description"
          content="EduTrack teacher student management page">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            EduTrack
        </div>

        <div class="nav-links">

            <a href="teacher-dashboard.html">
                Dashboard
            </a>

            <a href="index.html">
                Home
            </a>

        </div>

    </nav>


    <main class="dashboard">

        <h1>
            Registered Students 👨‍🎓
        </h1>

        <p>
            View students registered in EduTrack.
        </p>


        <!-- ADD STUDENT BUTTON -->

        <button
            class="login-btn"
            onclick="showAddStudentForm()">

            ➕ Add Student

        </button>


        <!-- ADD STUDENT FORM -->

        <div id="addStudentForm"
             style="display:none; margin-top:30px;"
             class="performance-summary">

            <h2>➕ Add New Student</h2>


            <form id="studentForm">


                <!-- STUDENT NAME -->

                <div class="form-group">

                    <label for="studentName">
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter student name"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="studentEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="studentEmail"
                        placeholder="Enter student email"
                        required>

                </div>


                <!-- COURSE -->

                <div class="form-group">

                    <label for="studentCourse">
                        Course
                    </label>

                    <input
                        type="text"
                        id="studentCourse"
                        placeholder="Enter course"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="studentPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="studentPassword"
                        placeholder="Enter student password"
                        required>

                </div>


                <!-- ADD BUTTON -->

                <button
                    type="submit"
                    class="login-btn">

                    Add Student

                </button>


                <!-- CANCEL BUTTON -->

                <button
                    type="button"
                    class="login-btn"
                    onclick="hideAddStudentForm()">

                    Cancel

                </button>


                <!-- MESSAGE -->

                <p id="addStudentMessage"></p>

            </form>

        </div>


        <!-- STUDENTS LIST -->

        <div id="studentsContainer"
             class="dashboard-cards">

            <p>
                Loading students...
            </p>

        </div>


        <!-- BACK TO DASHBOARD -->

        <div style="margin-top:30px;">

            <a
                href="teacher-dashboard.html"
                class="login-btn">

                ← Back to Dashboard

            </a>

        </div>

    </main>


    <script>


        /* =========================================
           SHOW ADD STUDENT FORM
        ========================================= */

        function showAddStudentForm() {

            document.getElementById(
                "addStudentForm"
            ).style.display = "block";

        }



        /* =========================================
           HIDE ADD STUDENT FORM
        ========================================= */

        function hideAddStudentForm() {

            document.getElementById(
                "addStudentForm"
            ).style.display = "none";


            document.getElementById(
                "studentForm"
            ).reset();


            document.getElementById(
                "addStudentMessage"
            ).innerText = "";

        }



        /* =========================================
           LOAD REGISTERED STUDENTS
        ========================================= */

        async function loadStudents() {

            const container =
                document.getElementById(
                    "studentsContainer"
                );


            try {

                const response =
                    await fetch(
                        "https://edutrack-website-710e.onrender.com/api/students"
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    container.innerHTML =
                        "<p>Unable to load students.</p>";

                    return;

                }


                /*
                   Your API may return either:
                   an array directly OR
                   an object containing students.
                */

                const students =
                    Array.isArray(data)
                        ? data
                        : data.students || [];


                if (students.length === 0) {

                    container.innerHTML =
                        "<p>No students found.</p>";

                    return;

                }


                container.innerHTML = "";


                students.forEach(
                    function(student) {


                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "dashboard-card";


                        card.innerHTML = `

                            <h2>👨‍🎓</h2>

                            <h3>
                                ${student.name || "Student"}
                            </h3>

                            <p>
                                Course:
                                ${student.course || "Not available"}
                            </p>

                            <p>
                                Email:
                                ${student.email || "Not available"}
                            </p>

                            <p>
                                Status:
                                ${student.status || "Active"}
                            </p>

                            <button
                                class="login-btn"
                                onclick="selectStudent('${student.email}')">

                                View Student

                            </button>

                        `;


                        container.appendChild(
                            card
                        );

                    }
                );


            } catch (error) {

                console.error(error);

                container.innerHTML =
                    "<p>Unable to connect to the server.</p>";

            }

        }



        /* =========================================
           SELECT STUDENT
        ========================================= */

        function selectStudent(email) {

            localStorage.setItem(
                "selectedStudentEmail",
                email
            );


            window.location.href =
                "teacher-student-profile.html";

        }



        /* =========================================
           ADD STUDENT
        ========================================= */

        document.getElementById(
            "studentForm"
        ).addEventListener(
            "submit",
            async function(event) {


                event.preventDefault();


                const name =
                    document.getElementById(
                        "studentName"
                    ).value.trim();


                const email =
                    document.getElementById(
                        "studentEmail"
                    ).value.trim();


                const course =
                    document.getElementById(
                        "studentCourse"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "studentPassword"
                    ).value;


                const message =
                    document.getElementById(
                        "addStudentMessage"
                    );


                /*
                   Show processing message
                */

                message.innerText =
                    "Adding student...";

                message.style.color =
                    "black";


                try {


                    const response =
                        await fetch(
                            "https://edutrack-website-710e.onrender.com/api/students",
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body: JSON.stringify({

                                    name: name,

                                    email: email,

                                    course: course,

                                    password: password

                                })

                            }
                        );


                    /*
                       Try to read the server response
                    */

                    const data =
                        await response.json();


                    /*
                       If server returns an error
                    */

                    if (!response.ok) {

                        message.innerText =
                            data.message ||
                            data.error ||
                            "Unable to add student.";

                        message.style.color =
                            "red";

                        return;

                    }


                    /*
                       Success
                    */

                    message.innerText =
                        "✅ Student added successfully!";

                    message.style.color =
                        "green";


                    /*
                       Clear form
                    */

                    document.getElementById(
                        "studentForm"
                    ).reset();


                    /*
                       Reload students
                       after a short delay
                    */

                    setTimeout(
                        function() {

                            hideAddStudentForm();

                            loadStudents();

                        },
                        1000
                    );


                } catch (error) {


                    console.error(
                        "Add student error:",
                        error
                    );


                    message.innerText =
                        "❌ Unable to connect to the server.";

                    message.style.color =
                        "red";

                }

            }
        );



        /* =========================================
           LOAD STUDENTS WHEN PAGE OPENS
        ========================================= */

        loadStudents();


    </script>


</body>

</html>
