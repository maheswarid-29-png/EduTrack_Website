<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | EduTrack</title>

    <meta name="description"
        content="Student login portal for EduTrack student management system">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>EduTrack</h1>

            <h2>Student Login</h2>

            <p>Login to access your student dashboard</p>

            <form id="studentLoginForm">

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit">
                    Login
                </button>

                <p id="loginMessage"></p>

            </form>

        </div>

    </div>

    <script>
        const loginForm = document.getElementById("studentLoginForm");
        const loginMessage = document.getElementById("loginMessage");

        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            loginMessage.textContent = "Logging in...";

            try {

                const response = await fetch(
                    "http://localhost:5001/api/students/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (response.ok) {

                    loginMessage.textContent = "Login successful!";

                    // Save student's email for the dashboard
                    localStorage.setItem("studentEmail", email);

                    // Open dashboard
                    setTimeout(function () {
                        window.location.href = "dashboard.html";
                    }, 500);

                } else {

                    loginMessage.textContent =
                        data.message || "Login failed";

                }

            } catch (error) {

                console.error(error);

                loginMessage.textContent =
                    "Unable to connect to the server.";

            }

        });
    </script>

</body>

</html>
