<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Login | EduTrack</title>

    <meta name="description"
        content="Teacher login portal for EduTrack student management system">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ================================
         NAVIGATION
    ================================= -->

    <nav class="navbar">

        <div class="logo">
            EduTrack
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About
            </a>

            <a href="contact.html">
                Contact
            </a>

        </div>

    </nav>


    <!-- ================================
         TEACHER LOGIN
    ================================= -->

    <main class="login-section">

        <div class="login-box">

            <h1>
                Teacher Login 👩‍🏫
            </h1>

            <p>
                Login to manage student attendance
                and academic performance.
            </p>


            <form id="teacherLoginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter teacher email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p
                id="loginMessage"
                style="margin-top: 20px;"
            ></p>

        </div>

    </main>


    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script>

        const form =
            document.getElementById(
                "teacherLoginForm"
            );


        const message =
            document.getElementById(
                "loginMessage"
            );


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                message.textContent =
                    "Logging in...";


                try {

                    const response =
                        await fetch(
                            "https://edutrack-website-710e.onrender.com/api/teachers/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        message.textContent =
                            data.message ||
                            "Login failed";

                        return;

                    }


                    // Save teacher email
                    localStorage.setItem(
                        "teacherEmail",
                        email
                    );


                    message.textContent =
                        "Login successful!";


                    // Open teacher dashboard
                    setTimeout(
                        function() {

                            window.location.href =
                                "teacher-dashboard.html";

                        },
                        500
                    );


                } catch (error) {

                    console.error(
                        error
                    );


                    message.textContent =
                        "Unable to connect to the server.";

                }

            }
        );

    </script>

</body>

</html>
